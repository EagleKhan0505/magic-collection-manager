<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-label="Esquema ilustrativo do Organizador Magic">
<rect width="1120" height="460" rx="20" fill="#f4f0e5"/>
<g font-family="Georgia,serif" fill="#343a31"><text x="45" y="62" font-size="31">Lembrar do efeito. Encontrar a carta.</text><text x="45" y="101" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#79756a">Uma coleção pessoal conectada às informações das cartas e aos meus decks.</text>
<path d="M300 250H410M705 250H790M552 181V154M552 319V349" stroke="#8b927d" stroke-width="2"/>
<rect x="45" y="180" width="255" height="142" rx="8" fill="#e3e7d8" stroke="#c3cbb6"/><text x="67" y="218" font-size="23">Minha coleção</text><path d="M67 235H276M67 261H276M67 287H276M130 235V308M213 235V308" stroke="#b3bea2"/><text x="67" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#626955">Planilha como base de dados</text>
<rect x="410" y="180" width="295" height="142" rx="8" fill="#fffdf7" stroke="#c7bfaa"/><text x="435" y="224" font-size="23">Encontrar pelo texto</text><text x="435" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#6d6a60">O efeito que eu lembro</text><text x="435" y="289" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#6d6a60">O nome que eu não lembro</text>
<text x="552" y="145" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#696555">API Scryfall</text>
<rect x="790" y="180" width="285" height="142" rx="8" fill="#d8e5e3" stroke="#b1c7c3"/><text x="815" y="222" font-size="23">Onde estou usando?</text><text x="815" y="262" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#506c67">Cartas associadas aos decks</text><text x="815" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#506c67">Contexto para comparar opções</text>
<rect x="410" y="349" width="665" height="56" rx="8" fill="#eee2ca" stroke="#c9b995" stroke-dasharray="5 4"/><text x="433" y="384" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#75623f">IA em desenvolvimento: em qual deck esta carta pode entrar?</text>
<text x="45" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#888174">Esquema ilustrativo. Não representa a interface nem dados reais da coleção.</text></g></svg>
